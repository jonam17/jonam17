 <text x="28" y="143" class="m" font-size="13" fill="#8b949e">NEXT.JS  •  REACT  •  FASTAPI  •  POSTGRESQL</text>
 <path d="M28 168h499" stroke="#30363d"/><text x="28" y="190" class="m" font-size="12" fill="#2dd4bf">INVENTORY → VISIBILITY → LESS FRICTION</text>
</g>
<g transform="translate(615 105)">
