<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Active Systems</title><desc id="d">Four MedTech and surgical simulation software projects.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
 <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:Inter,Segoe UI,Arial,sans-serif}
 .p{animation:p 2.2s ease-in-out infinite}@keyframes p{50%{opacity:.3}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="600" rx="20" fill="#0d1117" stroke="#1f6feb" stroke-opacity=".45"/>
<text x="38" y="48" class="m" font-size="18" fill="#58a6ff">ACTIVE SYSTEMS // PROJECT TELEMETRY</text>
<text x="38" y="76" class="m" font-size="13" fill="#8b949e">PURPOSE-BUILT SOFTWARE FOR REAL-WORLD MEDTECH AND SIMULATION WORKFLOWS</text>

<!-- cards -->
<g transform="translate(30 105)">
