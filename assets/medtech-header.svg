<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Jonathan Morales — MedTech, Surgical Simulation, Software Engineering</title>
<desc id="desc">Animated futuristic MedTech header with ECG trace and system grid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58a6ff"/><stop offset=".55" stop-color="#39d353"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".08"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .dash{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 4s ease-in-out infinite}
  .scan{animation:scan 6s linear infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes draw{0%{stroke-dashoffset:900}45%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
  @keyframes scan{from{transform:translateX(-250px)}to{transform:translateX(1450px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="330" rx="22" fill="url(#bg)"/>
<rect width="1200" height="330" rx="22" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="328" rx="21" fill="none" stroke="#1f6feb" stroke-opacity=".45"/>
<g opacity=".22" stroke="#58a6ff">
  <circle cx="1015" cy="150" r="105"/><circle cx="1015" cy="150" r="78"/><circle cx="1015" cy="150" r="48"/>
  <path d="M880 150h270M1015 15v270"/>
</g>
<g class="scan" opacity=".22"><rect x="0" width="180" height="330" fill="url(#line)"/></g>
<text x="72" y="82" class="mono" font-size="16" fill="#39d353">● SYSTEM ONLINE  //  PROFILE NODE: JONAM17</text>
<text x="72" y="148" class="sans" font-size="52" font-weight="800" letter-spacing="3" fill="#f0f6fc">JONATHAN MORALES</text>
<text x="74" y="190" class="mono" font-size="20" fill="#58a6ff">MEDTECH // SURGICAL SIMULATION // SOFTWARE ENGINEERING</text>
<text x="74" y="232" class="sans" font-size="18" fill="#8b949e">Building technology at the intersection of medicine, software, and real-world workflows.</text>
<path class="dash" d="M74 282h125l18-20 17 43 24-78 24 55h70l18-25 20 25h130l15-18 18 18h145" fill="none" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/>
<g transform="translate(1015 150)" fill="none" stroke="#58a6ff" filter="url(#glow)">
  <path d="M-22-56c-26 17-37 46-27 74 8 24 30 40 55 40 31 0 57-25 57-57 0-24-15-45-36-53" stroke-width="3"/>
  <path d="M-8-30c-12 11-18 27-13 43 5 17 20 28 38 28" stroke="#39d353" stroke-width="4" class="pulse"/>
  <circle r="7" fill="#39d353" stroke="none" class="pulse"/>
</g>
</svg>
